# Reverse proxy for the compose stack.
#
# One origin, no domain: the stack is reached by IP (e.g. http://192.168.0.100).
#   /                  → the React SPA container
#   /api/              → gunicorn (Django)
#   /static/, /media/  → files collected / uploaded by the backend
#
# Same origin means the refresh cookie needs no domain, CORS never enters the
# picture, and the SPA calls `/api/v1/...` as a relative path.
#
# If TLS is terminated in front of this container, set X-Forwarded-Proto there —
# Django's SECURE_PROXY_SSL_HEADER relies on it.

upstream backend_app {
    server backend:8000;
    keepalive 16;
}

upstream frontend_app {
    server frontend:80;
    keepalive 8;
}

server {
    listen 80 default_server;
    server_name _;

    # Excel imports and face photos are the largest uploads.
    client_max_body_size 32m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Collected by the backend container into a shared volume.
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /api/health/ {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/ {
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Left-most entry is what the API's IP throttles key on.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
