# Maktab davomat — one host, no domain.
#
# The installation runs on the school's own network and is reached by IP:
# http://192.168.0.100. There is no DNS name and no TLS in front of it, so
# everything lives on **one origin** — the SPA at `/`, the API under `/api/`.
#
# Same origin is what makes that work without a certificate: the browser sends
# the refresh cookie on its own, CORS never enters the picture, and the SPA can
# ask for `/api/v1/...` as a relative path, so the build carries no host name
# and keeps working if the address ever changes.
#
# `server_name` is matched on the Host header, and the socket stays the shared
# `listen 80` — binding the address itself would take every other site on this
# machine off port 80.
server {
    listen 80;
    listen [::]:80;
    # 127.0.0.1 is deliberately absent: another vhost on this machine already
    # claims it, and nginx would ignore the duplicate with a warning.
    server_name 192.168.0.100 localhost;

    root /www/wwwroot/websites/maktab-davomat/frontend/dist;
    index index.html;

    # Excel imports and face photos are the largest uploads.
    client_max_body_size 32m;

    access_log /www/wwwlogs/face-lan.log;
    error_log  /www/wwwlogs/face-lan.error.log;

    include /www/wwwroot/websites/maktab-davomat/deploy/nginx/host/security-headers.conf;

    # ----------------------------------------------------------------- API #
    location /api/ {
        proxy_pass http://127.0.0.1:8021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Plain HTTP all the way: Django must not think it is behind TLS, or
        # it would mark the refresh cookie Secure and the browser would drop it.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        # Turnstile syncs can be slow when a device is unresponsive.
        proxy_read_timeout 120s;
        proxy_buffering on;
    }

    # Django's own static files (DRF browsable API, branding) and uploads.
    location /static/ {
        include /www/wwwroot/websites/maktab-davomat/deploy/nginx/host/security-headers.conf;
        alias /www/wwwroot/websites/maktab-davomat/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /media/ {
        include /www/wwwroot/websites/maktab-davomat/deploy/nginx/host/security-headers.conf;
        alias /www/wwwroot/websites/maktab-davomat/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ----------------------------------------------------------------- SPA #
    # Hashed asset filenames are immutable.
    location /assets/ {
        include /www/wwwroot/websites/maktab-davomat/deploy/nginx/host/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /logo.png {
        include /www/wwwroot/websites/maktab-davomat/deploy/nginx/host/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # The shell must never be cached, or a deploy leaves stale asset refs.
    location = /index.html {
        include /www/wwwroot/websites/maktab-davomat/deploy/nginx/host/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Single-page app: unknown paths resolve to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
