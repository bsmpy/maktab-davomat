# Development / single-host production stack.
#
#   docker compose up -d --build
#   docker compose exec backend python manage.py migrate
#   docker compose exec backend python manage.py seed_demo
#
# Every service reads its secrets from the per-service .env files; nothing
# sensitive is written here.
name: maktab-davomat

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendance}
      POSTGRES_USER: ${POSTGRES_USER:-attendance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-attendance} -d ${POSTGRES_DB:-attendance}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published to the host by default — only the compose network needs it.
    expose:
      - '5432'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    expose:
      - '6379'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-attendance}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-attendance}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    expose:
      - '8000'

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config worker -l INFO --concurrency=4
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-attendance}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-attendance}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-attendance}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-attendance}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      backend: { condition: service_started }
      redis: { condition: service_healthy }

  tgbot:
    build:
      context: ./tgbot
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./tgbot/.env
    environment:
      BACKEND_API_URL: http://backend:8000
      REDIS_URL: redis://redis:6379/6
    depends_on:
      backend: { condition: service_started }
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = same origin: the SPA calls /api/v1 on the address it was opened from.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_APP_NAME: ${VITE_APP_NAME:-Maktab davomat}
    restart: unless-stopped
    expose:
      - '80'

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
