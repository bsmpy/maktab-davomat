    <title>Maktab davomat</title>
    <script>
      /* Stamp the palette before the first paint: React mounts later, and a
         flash of the light theme on a dark one is worse than a blocking inline
         script this small. Mirrors src/store/themeStore.ts.

         `davomat.multiTheme` is the cached answer from the server's shared
         appearance setting. If the extra palettes have been turned off for
         everyone, an old personal choice of one of them must not flash up
         before the store catches it. */
      (function () {
        try {
          var stored = localStorage.getItem('davomat.theme')
          var known = ['light', 'dark', 'violet', 'orange', 'emerald']
          if (localStorage.getItem('davomat.multiTheme') === 'off') {
            known = ['light', 'dark']
            if (stored && known.indexOf(stored) === -1) stored = 'dark'
          }
          document.documentElement.setAttribute(
            'data-theme',
            known.indexOf(stored) === -1 ? 'light' : stored,
          )
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
